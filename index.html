<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Estrato · Grabadora de clases</title>
<meta name="description" content="Graba clases de Geología en alta calidad, transcríbelas en español y expórtalas a Word o PDF junto con las diapositivas.">
<meta name="theme-color" content="#12805F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#/" aria-label="Estrato, ir a grabar">
    <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><use href="#logo"/></svg>
    <span>Estrato</span>
  </a>
  <nav aria-label="Principal">
    <a href="#/" data-nav="rec"><span class="dot" hidden></span>Grabar</a>
    <a href="#/clases" data-nav="lib">Clases</a>
  </nav>
</header>
<main id="view" tabindex="-1"></main>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg"></dialog>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="logo" viewBox="0 0 32 32">
    <rect width="32" height="32" rx="7" fill="currentColor" opacity=".12"/>
    <rect x="5" y="7" width="22" height="3.2" rx="1" fill="#12805F"/>
    <rect x="5" y="12" width="15" height="3.2" rx="1" fill="#12805F" opacity=".75"/>
    <rect x="5" y="17" width="19" height="3.2" rx="1" fill="#B07D1A"/>
    <rect x="5" y="22" width="11" height="3.2" rx="1" fill="#12805F" opacity=".5"/>
  </symbol>
</svg>
<noscript>Estrato necesita JavaScript para funcionar.</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
